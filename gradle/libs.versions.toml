[versions]
# Lowest supported Adventure of each major: compat/adventure-N is compiled against it, so it can only use what
# every N.x has. The version tests run on is -PadventureVersion (gradle.properties), not these.
adventure4 = "4.17.0"
adventure5 = "5.0.0"
annotations = "26.1.0"
junit = "6.1.3"
jmh = "1.37"
# The lowest Paper platform/paper supports: it is compiled against it, so it only uses what every later one has.
# CI also compiles it against newer ones (-PpaperVersion).
paper = "1.20.6-R0.1-SNAPSHOT"
placeholderapi = "2.12.3"
# Only in platform/paper's tests: the bridge finds MiniPlaceholders' API when the server runs.
miniplaceholders = "3.1.0"

[libraries]
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure4" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure4" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure4" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure4" }
adventure-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure4" }
adventure5-api = { module = "net.kyori:adventure-api", version.ref = "adventure5" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
miniplaceholders-api = { module = "io.github.miniplaceholders:miniplaceholders-api", version.ref = "miniplaceholders" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
jmh = { id = "me.champeau.jmh", version = "0.7.4" }
