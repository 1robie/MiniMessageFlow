[versions]
# Lowest supported Adventure of each major: compat/adventure-N is compiled against it, so it can only use what
# every N.x has. The version tests run on is -PadventureVersion (gradle.properties), not these.
adventure4 = "4.17.0"
adventure5 = "5.0.0"
annotations = "26.1.0"
junit = "6.1.3"
jmh = "1.37"

[libraries]
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure4" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure4" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure4" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure4" }
adventure5-api = { module = "net.kyori:adventure-api", version.ref = "adventure5" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
jmh = { id = "me.champeau.jmh", version = "0.7.4" }
