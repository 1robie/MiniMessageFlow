name: Build

on:
  push:
  pull_request:

jobs:
  test:
    name: Adventure ${{ matrix.adventure }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported, newest 4.x, then each 5.x minor. A new Adventure release is a new line here.
        adventure: [ "4.17.0", "4.26.1", "5.0.1", "5.1.1", "5.2.0" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compiles core against this Adventure and runs every test on it.
      - run: ./gradlew build -PadventureVersion=${{ matrix.adventure }} --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.adventure }}
          path: "**/build/reports/tests/"

  benchmarks-compile:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :benchmarks:jmhJar --console=plain
