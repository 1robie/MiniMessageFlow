name: Build

on:
  push:
  pull_request:

jobs:
  test:
    name: Adventure ${{ matrix.adventure }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported, newest 4.x, then each 5.x minor. A new Adventure release is a new line here.
        adventure: [ "4.17.0", "4.26.1", "5.0.1", "5.1.1", "5.2.0" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compiles core against this Adventure and runs every test on it.
      - run: ./gradlew build -PadventureVersion=${{ matrix.adventure }} --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.adventure }}
          path: "**/build/reports/tests/"

  paper:
    name: Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # platform/paper is compiled against the lowest (gradle/libs.versions.toml); this compiles and tests it against
        # newer ones, so an API it uses that a newer Paper changed shows here. A new Paper line is a new entry.
        paper: [ "1.21.11-R0.1-SNAPSHOT", "26.3.build.253-stable" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 runs Gradle and builds the module; Paper 26 needs 25, as a toolchain.
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      # setup-java exports JAVA_HOME_25_X64: Gradle finds the Java 25 toolchain there.
      - run: ./gradlew :platform:paper:test -PpaperVersion=${{ matrix.paper }} -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-paper-${{ matrix.paper }}
          path: "platform/paper/build/reports/tests/"

  benchmarks-compile:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :benchmarks:jmhJar --console=plain
